name: Build Moto APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Moto source
        shell: bash
        run: |
          set -e
          rm -rf /tmp/moto_src
          mkdir -p /tmp/moto_src
          unzip -q "Moto_V33_FIXED.zip" -d /tmp/moto_src
          src=$(find /tmp/moto_src -name pubspec.yaml -type f -print -quit); src=$(dirname "$src")
          test -n "$src"
          cp -R "$src"/. .
          test -f pubspec.yaml

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name moto --org com.moto .

      - name: Configure Firebase Android
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('android/app/build.gradle')
          text = app.read_text()
          text = re.sub(r'namespace\s*=\s*["\'][^"\']+["\']', 'namespace = "com.moto.sulaymaniyah"', text)
          text = re.sub(r'applicationId\s*[= ]\s*["\'][^"\']+["\']', 'applicationId = "com.moto.sulaymaniyah"', text)
          app.write_text(text)
          PY
          test -f android/app/google-services.json

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moto-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
